name: Android CI

# Her commit (push) ve pull request'te otomatik derleme başlar.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug + Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Android SDK kurulumu: imajda eksikse command-line tools indirilir,
      # lisanslar kabul edilir ve derleme için gerekli bileşenler
      # (platform-tools, android-35, build-tools 35.0.0) kurulur.
      - name: Setup Android SDK
        run: |
          set -e
          : "${ANDROID_HOME:=/opt/android-sdk}"
          export ANDROID_HOME
          mkdir -p "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo ">>> Android command-line tools indiriliyor..."
            cd "$RUNNER_TEMP"
            curl -sSLo cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdtools.zip
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo ">>> Kurulu SDK bileşenleri:"
          "$SDKMANAGER" --list_installed | head -40 || true

      # Her iki APK varyantini derle.
      # NVIDIA API anahtarı ve (opsiyonel) release keystore GitHub
      # Secrets'tan gelir ve repoya asla yazılmaz.
      - name: Build debug and release APKs
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          # Opsiyonel: secrets'tan release keystore üret
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            {
              echo "releaseStoreFile=release.keystore"
              echo "releaseStorePassword=$KEYSTORE_PASSWORD"
              echo "releaseKeyAlias=$KEY_ALIAS"
              echo "releaseKeyPassword=$KEY_PASSWORD"
            } >> local.properties
            echo ">>> Release keystore ayarlandi."
          else
            echo ">>> Keystore secret'i yok -> release APK imzasiz uretilecek."
          fi

          java -version 2>&1 | head -1
          echo ">>> ANDROID_HOME=$ANDROID_HOME"

          ./gradlew --no-daemon --stacktrace \
            assembleDebug assembleRelease \
            -Pnvidia_api_key="$NVIDIA_API_KEY" 2>&1 | tee build-output.log

      # Derleme hatasinda:
      #  (a) hatayi calisma sayfasina annotation olarak yazar
      #      (workflow command - token/izn gerekmez),
      #  (b) tam logu "build-output-log" artifact'i olarak yukler
      #      (indirmek icin Actions sayfasindan).
      # Bu adim ASLA basarisiz sayilmaz (set +e; exit 0).
      - name: Report build error (on failure)
        if: failure()
        run: |
          set +e
          if [ -f build-output.log ]; then
            WGW=$(awk '/What went wrong/{f=1} f{print; c++; if (c>=30) exit}' build-output.log)
            CAUSES=$(grep -m 10 'Caused by:' build-output.log)
            CODE=$(grep -A 6 -E '^(e: |error: |> Task .*FAILED|Execution failed for task)' build-output.log | head -n 80)
            TASKS=$(grep -E '^> Task ' build-output.log | tail -n 15 | tr '\n' ' ')
            SUM=$(grep -E 'BUILD (FAILED|SUCCESSFUL)|actionable task' build-output.log | tail -n 2)
            [ -z "$WGW" ] && WGW=$(tail -n 40 build-output.log)
          else
            WGW="(build-output.log bulunamadi)"
          fi
          ERR=$(printf '%s\n--- CAUSE ---\n%s\n--- HATA SATIRLARI ---\n%s\n--- SON TASKLAR ---\n%s\n--- OZET ---\n%s' \
            "$WGW" "$CAUSES" "$CODE" "$TASKS" "$SUM" \
            | sed -E 's/(nvidia_api_key=")[^"]*(")/\1***\2/' \
            | tr '\n' '|' \
            | tail -c 40000)
          [ -z "$ERR" ] && ERR="(extract bos)"
          echo "::error file=.github/workflows/android.yml,line=1::GRADLE HATA: $ERR"
          exit 0

      - name: Upload build log artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: build-output-log
          path: |
            build-output.log
            ci/last-error.log
          if-no-files-found: ignore
          retention-days: 14

      - name: List build outputs
        if: success()
        run: |
          echo "=== Üretilen APK dosyaları ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RaiwesyAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: RaiwesyAI-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
