name: Android CI

# Her commit (push) ve pull request'te otomatik derleme başlar.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug + Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Android SDK kurulumu: imajda eksikse command-line tools indirilir,
      # lisanslar kabul edilir ve derleme için gerekli bileşenler
      # (platform-tools, android-35, build-tools 35.0.0) kurulur.
      - name: Setup Android SDK
        run: |
          set -e
          : "${ANDROID_HOME:=/opt/android-sdk}"
          export ANDROID_HOME
          mkdir -p "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo ">>> Android command-line tools indiriliyor..."
            cd "$RUNNER_TEMP"
            curl -sSLo cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdtools.zip
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo ">>> Kurulu SDK bileşenleri:"
          "$SDKMANAGER" --list_installed | head -40 || true

      # Her iki APK varyantini derle.
      # NVIDIA API anahtarı ve (opsiyonel) release keystore GitHub
      # Secrets'tan gelir ve repoya asla yazılmaz.
      - name: Build debug and release APKs
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          # Opsiyonel: secrets'tan release keystore üret
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            {
              echo "releaseStoreFile=release.keystore"
              echo "releaseStorePassword=$KEYSTORE_PASSWORD"
              echo "releaseKeyAlias=$KEY_ALIAS"
              echo "releaseKeyPassword=$KEY_PASSWORD"
            } >> local.properties
            echo ">>> Release keystore ayarlandi."
          else
            echo ">>> Keystore secret'i yok -> release APK imzasiz uretilecek."
          fi

          java -version 2>&1 | head -1
          echo ">>> ANDROID_HOME=$ANDROID_HOME"

          ./gradlew --no-daemon --stacktrace \
            assembleDebug assembleRelease \
            -Pnvidia_api_key="$NVIDIA_API_KEY" 2>&1 | tee build-output.log

      # Derleme hatasinda hatayi (a) calisma sayfasina annotation olarak
      # yazar, (b) repoya ci/last-error.log olarak push'lar.
      # Bu adim ASLA basarisiz sayilmaz (set +e); amaclar bilgilendirme.
      - name: Report build error (on failure)
        if: failure()
        run: |
          set +e
          ERR=$(tail -n 300 build-output.log 2>/dev/null \
            | sed -E 's/(nvidia_api_key=")[^"]*(")/\1***\2/' \
            | tail -c 30000)
          [ -z "$ERR" ] && ERR="(build-output.log bulunamadi)"

          # --- kanal 1: check-run annotation (calisma sayfasindan okunur) ---
          ERRMSG="$ERR" python3 - <<'PYEOF'
          import json, os
          msg = os.environ.get("ERRMSG", "")[:60000]
          body = [{
              "path": ".github/workflows/android.yml",
              "start_line": 1,
              "end_line": 1,
              "annotation_level": "failure",
              "message": "=== GRADLE HATA DETAYI (son satirlar) ===\n" + msg,
          }]
          open("/tmp/ann.json", "w").write(json.dumps(body))
          PYEOF
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs/$GITHUB_JOB/annotations" \
            --input /tmp/ann.json > /tmp/ann_result.txt 2>&1 \
            && echo ">>> Annotation yazildi." \
            || { echo ">>> Annotation basarisiz:"; cat /tmp/ann_result.txt; }

          # --- kanal 2: repoya dosya olarak (dongu korumali) ---
          mkdir -p ci
          {
            echo "# Son basarisiz CI derlemesi"
            echo "# run: ${{ github.run_id }} sha: ${{ github.sha }}"
            echo "==================== GRADLE (son 300 satir) ===================="
            tail -n 300 build-output.log 2>/dev/null || echo "(build-output.log yok)"
          } > ci/last-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/last-error.log
          if git diff --cached --quiet; then
            echo ">>> Ayni hata zaten repoda -> push yok (dongu korumasi)."
          else
            git commit -m "chore(ci): son build hatasi (run ${{ github.run_id }})" \
              && git push origin HEAD:"${{ github.ref_name }}" \
              && echo ">>> Hata logu repoya yazildi: ci/last-error.log" \
              || echo ">>> Repo push'u basarisiz (annotation kanali hala gecerli)."
          fi
          exit 0

      - name: List build outputs
        run: |
          echo "=== Üretilen APK dosyaları ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RaiwesyAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: RaiwesyAI-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
