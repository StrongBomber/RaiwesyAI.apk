name: Android CI

# Her commit (push) ve pull request'te otomatik derleme başlar.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug + Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Android SDK otomatik kurulumu (platform + build-tools)
      - name: Setup Android SDK
        uses: android/setup-android@v3

      # Her iki APK varyantini derle.
      # NVIDIA API anahtarı ve (opsiyonel) release keystore GitHub
      # Secrets'tan gelir ve repoya asla yazılmaz.
      - name: Build debug and release APKs
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Opsiyonel: secrets'tan release keystore üret
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            {
              echo "releaseStoreFile=release.keystore"
              echo "releaseStorePassword=$KEYSTORE_PASSWORD"
              echo "releaseKeyAlias=$KEY_ALIAS"
              echo "releaseKeyPassword=$KEY_PASSWORD"
            } >> local.properties
            echo "Release keystore ayarlandi."
          else
            echo "Keystore secret'i yok -> release APK imzasiz uretilecek."
          fi

          ./gradlew --no-daemon --stacktrace \
            assembleDebug assembleRelease \
            -Pnvidia_api_key="$NVIDIA_API_KEY"

      - name: List build outputs
        run: |
          echo "=== Üretilen APK dosyaları ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RaiwesyAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: RaiwesyAI-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
